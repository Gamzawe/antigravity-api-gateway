# Nginx Reverse Proxy Configuration for Antigravity API Gateway
# Place in /etc/nginx/sites-available/antigravity-gateway.conf and symlink to sites-enabled/

server {
    listen 80;
    server_name api.yourdomain.com; # Replace with your VPS domain or IP

    # Redirect all HTTP traffic to HTTPS (recommended after certbot setup)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Crucial for SSE Streaming (real-time tokens & thinking blocks)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Generous timeouts for large context and extended thinking models
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
