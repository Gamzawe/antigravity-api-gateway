services:
  - type: web
    name: antigravity-api-gateway
    runtime: rust
    plan: free
    region: oregon
    buildCommand: cargo build --release
    startCommand: ./target/release/rust-gateway
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: ./data
      - key: PUBLIC_URL
        sync: false
